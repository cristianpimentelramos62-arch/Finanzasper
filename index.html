.cap{padding:26px 28px}

body{-webkit-text-size-adjust:100%;text-size-adjust:100%}

.hpop{position:fixed;z-index:30;width:min(300px,90vw);max-height:62vh;display:flex;flex-direction:column;background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--gb);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.32);padding:12px;color:var(--tx)}

</style></head><body>

<button id="bu"><svg viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>Subir</button>
<button id="bp"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="12" height="16" rx="2"/><path d="M9 5V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/></svg>Pegar</button>

<dialog id="dg"><h3>Maestro de zonas</h3><p>Asigna cada fundo a su zona. Lo que no esté aquí va a la zona por defecto.</p>
<div class="mr"><span>Zona por defecto</span><input id="dz" list="zl"></div>
<div id="ml"></div>
<div class="mr" style="margin-top:12px"><input class="w" id="nf" placeholder="Nuevo fundo"><input id="nz" list="zl" placeholder="Zona"><button id="na">+</button></div>
<datalist id="zl"></datalist>
<div class="dl"><button id="rs">Restablecer</button><button id="rb">Quitar fondo</button><button class="ok" id="cl">Listo</button></div></dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const DEF={zona:'VIRÚ',excl:'FN',map:{'EL RETIRO':'OLMOS','SANTA ROSA':'SANTA','SANTA MARIA':'SANTA'}};
const clone=o=>JSON.parse(JSON.stringify(o));
let M=(()=>{try{const j=localStorage.getItem('maestro_zonas');if(j)return JSON.parse(j)}catch(e){}return clone(DEF)})();
const save=()=>{try{localStorage.setItem('maestro_zonas',JSON.stringify(M))}catch(e){}};
const key=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase().replace(/\s+/g,' ');
const zonaDe=f=>M.map[key(f)]||M.zona;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('en-US');
let rows=[];
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
function tsv(t){const R=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"'&&!c)q=true;else if(ch=='\t'){r.push(c);c=''}else if(ch=='\n'){r.push(c);R.push(r);r=[];c=''}else if(ch!='\r')c+=ch}
 if(c||r.length){r.push(c);R.push(r)}return R}
const num=s=>{s=String(s||'').trim();if(!s)return 0;if(s.includes(',')&&!s.includes('.'))s=s.replace(',','.');else s=s.replace(/,/g,'');return parseFloat(s)||0};
function load(text){loadT(tsv(text))}
function loadT(T){if(T.length<2){toast('No se detectaron filas');return}
 const H=T[0].map(key),ix=n=>H.indexOf(n);
 const c={fe:ix('FECHA'),va:ix('VARIEDAD'),fu:ix('FUNDO'),mo:ix('MODULO'),fo:ix('FORMATO'),ki:ix('KILOS'),ba:ix('BANDEJA')};const ta=ix('TARJA');const core=new Set([c.fe,c.va,c.fu,c.mo,c.fo,c.ki,c.ba,ta]);const ex=[];T[0].forEach((h,j)=>{const l=String(h==null?'':h).trim();if(l&&!core.has(j))ex.push({k:'x_'+key(l).replace(/[^A-Z0-9]+/g,'_'),l,j})});setCols(ex);const exv=r=>{const o={};ex.forEach(e=>{o[e.k]=String(r[e.j]==null?'':r[e.j]).trim()});return o};
 if(Object.values(c).some(v=>v<0)){toast('Faltan columnas: copia la hoja completa con encabezados');return}
 rows=T.slice(1).filter(r=>r[c.fu]).map(r=>({fecha:fd(r[c.fe]),variedad:key(r[c.va]),fundo:key(r[c.fu]),modulo:key(r[c.mo]),tarja:ta>=0?String(r[ta]==null?'':r[ta]).trim().toUpperCase():'',formato:key(r[c.fo]),b:num(r[c.ba]),k:num(r[c.ki]),...exv(r)}));
 $('#st').textContent='✓ '+fmt(rows.length)+' filas cargadas';setTimeout(()=>{$('#st').textContent=''},3500);render();renderGrid();
}
const gb=(a,f)=>{const m=new Map();a.forEach(x=>{const k=f(x);(m.get(k)||m.set(k,[]).get(k)).push(x)});return[...m]};
const sum=(a,p)=>a.reduce((s,x)=>s+x[p],0);
const cmp=(...ks)=>(a,b)=>{for(const k of ks){const d=String(a[k]).localeCompare(String(b[k]),'es',{numeric:true});if(d)return d}return 0};
function aggr(rs,f){const A=new Map();rs.forEach(r=>{const k=f.map(x=>r[x]).join('|');let a=A.get(k);if(!a){a={b:0,k:0};f.forEach(x=>a[x]=r[x]);A.set(k,a)}a.b+=r.b;a.k+=r.k});return[...A.values()]}
const nums=(b,k)=>`<td class=n>${fmt(b)}</td><td class=n>${fmt(k)}</td>`;
const zt=(z,l,n)=>`<tr class=zt><td colspan=${n}>Total ${esc(z)}</td>${nums(sum(l,'b'),sum(l,'k'))}</tr>`;
const gt=(L,n)=>`<tr class=gt><td colspan=${n}>Total general</td>${nums(sum(L,'b'),sum(L,'k'))}</tr>`;
function t1(rs){
 const vi={};rs.forEach(r=>{if(!(r.variedad in vi))vi[r.variedad]=Object.keys(vi).length});
 const L=aggr(rs,['zona','formato','variedad','fundo']);L.forEach(a=>a.vi=vi[a.variedad]);L.sort(cmp('zona','formato','vi','fundo'));
 const hc=(k,lbl)=>`<th class="f${FL.t1[k]&&FL.t1[k].length?' on':''}" data-tid="t1" data-col="${k}" style="width:${{zona:'18%',formato:'15%',variedad:'27%',fundo:'17%'}[k]}">${lbl}</th>`;
 let h='<table class=pv><tr>'+hc('zona','Zona')+hc('formato','Formato')+hc('variedad','Variedad')+hc('fundo','Fundo')+'<th class=n style="width:12%">Bandejas</th><th class=n style="width:11%">Kilos</th></tr>';
 gb(L,a=>a.zona).forEach(([z,zl])=>{let zf=1;
  gb(zl,a=>a.formato).forEach(([f,fl])=>{let ff=1;
   gb(fl,a=>a.variedad).forEach(([v,vl])=>{
    vl.forEach((a,i)=>{h+=`<tr><td class=z>${zf?esc(z):''}</td><td class=b>${ff?esc(f):''}</td><td>${i?'':esc(v)}</td><td>${esc(a.fundo)}</td>${nums(a.b,a.k)}</tr>`;zf=ff=0});
    h+=`<tr class=sub><td class=z></td><td class=w></td><td colspan=2>Total ${esc(v)}</td>${nums(sum(vl,'b'),sum(vl,'k'))}</tr>`})});
  h+=zt(z,zl,4)});
 return h+gt(L,4)+'</table>'}
function t2(rs){
 const L=aggr(rs,['zona','fundo','modulo','variedad','formato']).sort(cmp('zona','fundo','modulo','variedad','formato'));
 const hc=(k,lbl)=>`<th class="f${FL.t2[k]&&FL.t2[k].length?' on':''}" data-tid="t2" data-col="${k}" style="width:${{zona:'15%',fundo:'17%',modulo:'12%',variedad:'22%',formato:'12%'}[k]}">${lbl}</th>`;
 let h='<table class=pv><tr>'+hc('zona','Zona')+hc('fundo','Fundo')+hc('modulo','Módulo')+hc('variedad','Variedad')+hc('formato','Formato')+'<th class=n style="width:11%">Bandejas</th><th class=n style="width:11%">Kilos</th></tr>';
 gb(L,a=>a.zona).forEach(([z,zl])=>{let zf=1;
  gb(zl,a=>a.fundo).forEach(([f,fl])=>{let ff=1;
   gb(fl,a=>a.modulo).forEach(([m,ml])=>{
    ml.forEach((a,i)=>{h+=`<tr><td class=z>${zf?esc(z):''}</td><td class=b>${ff?esc(f):''}</td><td>${i?'':esc(m)}</td><td class=b>${i&&ml[i-1].variedad===a.variedad?'':esc(a.variedad)}</td><td>${esc(a.formato)}</td>${nums(a.b,a.k)}</tr>`;zf=ff=0})})});

const FLDEF={t1:{fmt:['FN'],zon:[],var:[],fun:[]},t2:{fmt:[],zon:[],var:[],fun:[],mod:[]}};
const COLMAP={zona:'zon',formato:'fmt',variedad:'var',fundo:'fun',modulo:'mod'};
let FL=(()=>{try{const j=localStorage.getItem('filtros_rep');if(j){const p=JSON.parse(j);if(p&&p.t1&&p.t2)return{t1:{...clone(FLDEF.t1),...p.t1},t2:{...clone(FLDEF.t2),...p.t2}}}}catch(e){}return clone(FLDEF)})(),FO={t1:0,t2:0};
const saveFl=()=>{try{localStorage.setItem('filtros_rep',JSON.stringify(FL))}catch(e){}};
function panel(id,all){
 const f=[...new Set(all.map(r=>r.formato))];if(id==='t1'&&!f.includes('FN'))f.push('FN');f.sort();
 const z=[...new Set(all.map(r=>r.zona))].sort();
 const chip=(g,v)=>`<button class="chip${FL[id][g].includes(v)?'':' on'}" onclick="tg('${id}','${g}','${v}')">${esc(v)}</button>`;
 return `<div class=fgrp><b>Formato</b><div>${f.map(v=>chip('fmt',v)).join('')}</div></div><div class=fgrp><b>Zona</b><div>${z.map(v=>chip('zon',v)).join('')}</div></div><button class=lnk onclick="rf('${id}')">Restablecer</button>`}
function keep(){const y=scrollY;render();scrollTo(0,y)}
function tg(id,g,v){const a=FL[id][g],i=a.indexOf(v);if(i<0)a.push(v);else a.splice(i,1);saveFl();keep()}
function rf(id){FL[id]=clone(FLDEF[id]);saveFl();keep()}
function fo(id){FO[id]=!FO[id];keep()}
function card(id,name,date,body,pn){const n=Object.values(FL[id]).reduce((s,a)=>s+a.length,0);return`<section class=card><div class=sc><div class=cap id=${id}><div class=top><div class=fecha><span>Fecha:</span><span>${esc(date)}</span></div>${LOGO}</div>${body}</div></div><div class=acts><button onclick="fo('${id}')">Filtros${n?' ('+n+')':''}</button><button class=s onclick="share('${id}','${name}',this)">Descargar HD</button></div>${FO[id]?'<div class=fp>'+pn+'</div>':''}</section>`}
function render(){
 closePop();
 if(!rows.length){$('#out').innerHTML='<p class=empty>Sube o pega tu reporte de Excel<br>y aquí aparecerán las dos tablas.</p>';return}
 const all=rows.map(r=>({...r,zona:zonaDe(r.fundo)}));
 const pick=id=>all.filter(r=>!(FL[id].fmt||[]).includes(r.formato)&&!(FL[id].zon||[]).includes(r.zona)&&!(FL[id].var||[]).includes(r.variedad)&&!(FL[id].fun||[]).includes(r.fundo)&&!(FL[id].mod||[]).includes(r.modulo));
 const cnt={};rows.forEach(r=>cnt[r.fecha]=(cnt[r.fecha]||0)+1);
 const date=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]||'';
 const d=date.replace(/\//g,'-');
 $('#out').innerHTML=card('t1','Reporte_Formato_'+d,date,t1(pick('t1')),panel('t1',all))+card('t2','Reporte_Modulo_'+d,date,t2(pick('t2')),panel('t2',all));
 $('#out').querySelectorAll('th.f').forEach(th=>th.onclick=e=>{e.stopPropagation();openReportPop(th)});
 fit();
}

function showImg(src){const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.85);overflow:auto;padding:20px;text-align:center;color:#fff';o.innerHTML='<p>Mantén presionada la imagen y elige «Guardar en Fotos» o «Compartir»</p><img style="width:100%;border-radius:8px;background:#fff"><br><button style="margin:14px;padding:12px 24px;border-radius:12px;border:0;font-size:16px">Cerrar</button>';o.querySelector('img').src=src;o.querySelector('button').onclick=()=>o.remove();document.body.appendChild(o)}
async function share(id,name,btn){
 closePop();
 const old=btn.textContent;btn.disabled=true;btn.textContent='Generando…';
 try{
  const el=$('#'+id),sc=el.parentElement;el.style.transform='none';sc.style.overflow='visible';sc.style.height='auto';
  const c=await html2canvas(el,{scale:3,backgroundColor:'#fff',useCORS:true});
  const url=c.toDataURL('image/png');
  const a=document.createElement('a');a.href=url;a.download=name+'.png';document.body.appendChild(a);a.click();a.remove();
  showImg(url);
 }catch(e){toast('No se pudo generar la imagen')}
 finally{btn.disabled=false;btn.textContent=old;fit()}
}

const fv=(r,k)=>typeof r[k]==='number'?r[k].toLocaleString('en-US',{maximumFractionDigits:2}):esc(r[k]==null?'':r[k]);
function renderGrid(){
 const g=$('#grid');if(!rows.length){g.innerHTML='';return}
 g.innerHTML='<section class=gcard><div class=gh><h3>Data general</h3><button id=eye aria-label="Columnas"><svg width=22 height=22 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=1.8 stroke-linecap=round stroke-linejoin=round><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx=12 cy=12 r=3 /></svg></button></div><div id=colp class=fp style="display:none"></div><div class=gs><table class=gt2><thead><tr>'+VC().map(c=>`<th data-gk="${c[0]}">${c[1]} ▾</th>`).join('')+'</tr><tr>'+VC().map(c=>`<th><input data-c="${c[0]}" value="${esc(flt[c[0]]||'')}" placeholder="Filtrar"></th>`).join('')+'</tr></thead><tbody id=gb></tbody></table></div><div class=bulk><div id=brs></div><button id=bad class=add>+ Agregar columna</button><button id=ba>Aplicar</button></div><div class=gm><span id=gn></span><button id=gmore>Ver más</button></div></section>';
 g.querySelectorAll('thead tr:first-child th').forEach(th=>th.onclick=e=>{e.stopPropagation();openGridPop(th)});
 g.querySelectorAll('thead input').forEach(i=>i.oninput=()=>{flt[i.dataset.c]=i.value;lastF=i.dataset.c;syncSel();lim=100;gbody()});
 $('#gmore').onclick=()=>{lim+=200;gbody()};
 $('#gb').onclick=cellClick;$('#ba').onclick=bulk;$('#eye').onclick=()=>{GP=!GP;buildColp()};buildColp();$('#bad').onclick=()=>addRow();addRow(lastF||'fundo');gbody();
}
function gbody(){
 const f=Object.entries(flt).filter(e=>e[1].trim()&&vis().includes(e[0])).map(e=>[e[0],e[1].trim().toUpperCase()]);
 const L=[];rows.forEach((r,i)=>{if(f.every(([k,v])=>String(r[k]==null?'':r[k]).toUpperCase().includes(v)))L.push(i)});
 $('#gb').innerHTML=L.slice(0,lim).map(i=>{const r=rows[i];return '<tr>'+VC().map(c=>`<td data-i=${i} data-k=${c[0]}${typeof r[c[0]]==='number'?' class=n':''}>${fv(r,c[0])}</td>`).join('')+'</tr>'}).join('');
 $('#gn').textContent='Mostrando '+Math.min(lim,L.length).toLocaleString('en-US')+' de '+L.length.toLocaleString('en-US')+' filas · doble toque para editar';
 $('#gmore').style.display=L.length>lim?'':'none';curL=L;$('#ba').textContent='Aplicar a '+L.length.toLocaleString('en-US')+' filas filtradas';
}
let curL=[],lastF='';
function syncSel(){const rs=document.querySelectorAll('.brow');if(rs.length===1&&!rs[0].querySelector('.bv').value)rs[0].querySelector('.bc').value=lastF}
function addRow(col){const d=document.createElement('div');d.className='brow';
 d.innerHTML='<select class=bc>'+VC().map(c=>`<option value=${c[0]}>${c[1]}</option>`).join('')+'</select><input class=bv placeholder="Nuevo valor"><button class=bdel>✕</button>';
 const used=[...document.querySelectorAll('.bc')].map(s=>s.value);
 d.querySelector('.bc').value=col||(VC().map(c=>c[0]).find(k=>!used.includes(k))||'fundo');
 d.querySelector('.bdel').onclick=()=>{if(document.querySelectorAll('.brow').length>1)d.remove()};
 $('#brs').appendChild(d)}
function bulk(){
 if(!Object.entries(flt).some(e=>e[1].trim()&&vis().includes(e[0]))){toast('Primero filtra las filas que quieres cambiar');return}
 if(!curL.length){toast('No hay filas filtradas');return}
 const ch=[];
 for(const r of document.querySelectorAll('.brow')){const k=r.querySelector('.bc').value,raw=r.querySelector('.bv').value.trim();if(!raw)continue;ch.push([k,(k==='b'||k==='k')?num(raw):((k==='fecha'||k.startsWith('x_'))?raw:key(raw))])}
 if(!ch.length){toast('Escribe al menos un valor nuevo');return}
 const L=curL.slice();L.forEach(i=>ch.forEach(([k,v])=>{rows[i][k]=v}));
 toast('\u2713 '+L.length.toLocaleString('en-US')+' filas actualizadas ('+ch.length+(ch.length>1?' columnas)':' columna)'));
 document.querySelectorAll('.bv').forEach(i=>{i.value=''});gbody();render()}
function cellClick(e){const td=e.target.closest('td');if(!td||td.querySelector('input'))return;const n=Date.now();if(lc===td&&n-lt<400){lc=null;edit(td)}else{lc=td;lt=n}}
function edit(td){const i=+td.dataset.i,k=td.dataset.k,r=rows[i],isN=typeof r[k]==='number';const inp=document.createElement('input');inp.value=r[k];inp.style.cssText='width:100%;min-width:70px;font:16px system-ui,sans-serif;padding:4px';td.textContent='';td.appendChild(inp);inp.focus();inp.select();
 let done=0;const ok=()=>{if(done)return;done=1;let v=inp.value.trim();v=isN?num(v):((k==='fecha'||k.startsWith('x_'))?v:key(v));r[k]=v;td.innerHTML=fv(r,k);render()};
 inp.onblur=ok;inp.onkeydown=e=>{if(e.key==='Enter')ok();if(e.key==='Escape'){done=1;td.innerHTML=fv(r,k)}}}
function fit(){document.querySelectorAll('.sc').forEach(sc=>{const c=sc.firstElementChild;c.style.transform='none';sc.style.height='auto';sc.style.overflow='hidden';const s=Math.min(1,sc.clientWidth/c.offsetWidth);c.style.transformOrigin='0 0';c.style.transform=s<1?'scale('+s+')':'none';sc.style.height=(c.offsetHeight*s)+'px'})}
addEventListener('resize',fit);
const fd=v=>{if(typeof v==='number'&&v>30000){const d=new Date(Math.round((v-25569)*864e5));return String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+'/'+d.getUTCFullYear()}return String(v||'')};
$('#bu').onclick=()=>$('#fx').click();
$('#fx').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#st').textContent='Leyendo…';try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];loadT(XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}))}catch(err){toast('No se pudo leer el archivo')}if(!rows.length)$('#st').textContent='';e.target.value=''};
document.addEventListener('paste',e=>{const t=(e.clipboardData||window.clipboardData).getData('text');if(t&&t.includes('\t')){e.preventDefault();load(t)}});
$('#bp').onclick=async()=>{try{const t=await navigator.clipboard.readText();if(!t.trim())throw 0;load(t)}catch(e){toast('Pegar no está permitido aquí: usa Subir')}};
let bgData='';
const setBg=u=>document.documentElement.style.setProperty('--bi',u?'url("'+u+'")':'none');
try{const b=localStorage.getItem('fondo');if(b){bgData=b;setBg(b)}}catch(e){}
$('#bb').onclick=()=>$('#fb').click();
$('#fb').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);let d=c.toDataURL('image/jpeg',.65);if(d.length>230000)d=c.toDataURL('image/jpeg',.4);bgData=d;setBg(d);try{localStorage.setItem('fondo',d)}catch(x){}URL.revokeObjectURL(u)};im.src=u;e.target.value=''};
$('#rb').onclick=()=>{bgData='';setBg('');try{localStorage.removeItem('fondo')}catch(e){}};
$('#bx').onclick=()=>{rows=[];$('#st').textContent='';render();renderGrid()};
let activePop=null;
function closePop(){if(activePop){activePop.remove();activePop=null}}
document.addEventListener('click',e=>{if(activePop&&!activePop.contains(e.target))closePop()});
addEventListener('scroll',closePop,{passive:true});

function posPop(pop,anchor){
 const r=anchor.getBoundingClientRect();
 document.body.appendChild(pop);
 const pw=pop.offsetWidth,ph=pop.offsetHeight;
 let left=Math.max(12,Math.min(innerWidth-pw-12,r.left));
 let top=r.bottom+6;
 if(top+ph>innerHeight-12)top=Math.max(12,r.top-ph-6);
 pop.style.left=left+'px';pop.style.top=top+'px';
 activePop=pop;
}

function openReportPop(th){
 const tid=th.dataset.tid,col=th.dataset.col,g=COLMAP[col];
 if(activePop&&activePop.dataset.key===tid+':'+col){closePop();return}
 closePop();
 const all=rows.map(r=>({...r,zona:zonaDe(r.fundo)}));
 const vals=[...new Set(all.map(r=>r[col]).filter(v=>v!==''&&v!=null))];
 if(tid==='t1'&&col==='formato'&&!vals.includes('FN'))vals.push('FN');
 vals.sort((a,b)=>String(a).localeCompare(String(b),'es',{numeric:true}));
 const excl=FL[tid][g]||[];
 const pop=document.createElement('div');pop.className='hpop';pop.dataset.key=tid+':'+col;
 pop.innerHTML=`<div class=hpop-hd><span>Filtrar ${esc(th.textContent)}</span><button type=button id=hp-x>✕</button></div>`+
  (vals.length>6?'<input class=hpop-sr placeholder="Buscar...">':'')+
  `<div class=hpop-act><button type=button id=hp-all>Seleccionar todo</button><button type=button id=hp-clr>Limpiar</button></div><div class=hpop-ls></div>`;
 const ls=pop.querySelector('.hpop-ls');
 const drawList=(q='')=>{
  const fq=key(q);
  ls.innerHTML=vals.filter(v=>!fq||key(v).includes(fq)).map(v=>{
   const on=!excl.includes(v);
   return `<label class=hpop-it><input type=checkbox data-v="${esc(v)}"${on?' checked':''}><span>${esc(v)}</span></label>`;
  }).join('')||'<div style="padding:8px;font-size:13px;color:var(--mu)">Sin coincidencias</div>';
  ls.querySelectorAll('input').forEach(cb=>cb.onchange=()=>{
   const v=cb.dataset.v,i=excl.indexOf(v);
   if(cb.checked){if(i>=0)excl.splice(i,1)}else{if(i<0)excl.push(v)}
   FL[tid][g]=excl;saveFl();
   const y=scrollY;
   const pick=id=>all.filter(r=>!(FL[id].fmt||[]).includes(r.formato)&&!(FL[id].zon||[]).includes(r.zona)&&!(FL[id].var||[]).includes(r.variedad)&&!(FL[id].fun||[]).includes(r.fundo)&&!(FL[id].mod||[]).includes(r.modulo));
   const cnt={};rows.forEach(r=>cnt[r.fecha]=(cnt[r.fecha]||0)+1);
   const date=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]||'';
   const d=date.replace(/\//g,'-');
   $('#out').innerHTML=card('t1','Reporte_Formato_'+d,date,t1(pick('t1')),panel('t1',all))+card('t2','Reporte_Modulo_'+d,date,t2(pick('t2')),panel('t2',all));
   $('#out').querySelectorAll('th.f').forEach(h=>h.onclick=e=>{e.stopPropagation();openReportPop(h)});
   fit();scrollTo(0,y);
  });
 };
 drawList();
 const sr=pop.querySelector('.hpop-sr');if(sr)sr.oninput=()=>drawList(sr.value);
 pop.querySelector('#hp-x').onclick=closePop;
 pop.querySelector('#hp-all').onclick=()=>{FL[tid][g]=[];saveFl();render()};
 pop.querySelector('#hp-clr').onclick=()=>{FL[tid][g]=vals.slice();saveFl();render()};
 posPop(pop,th);
}

function openGridPop(th){
 const k=th.dataset.gk;
 if(activePop&&activePop.dataset.key==='grid:'+k){closePop();return}
 closePop();
 const vals=[...new Set(rows.map(r=>String(r[k]==null?'':r[k]).trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es',{numeric:true}));
 const cur=String(flt[k]||'').trim().toUpperCase();
 const pop=document.createElement('div');pop.className='hpop';pop.dataset.key='grid:'+k;
 pop.innerHTML=`<div class=hpop-hd><span>${esc(th.textContent.replace(' ▾',''))}</span><button type=button id=hp-x>✕</button></div>`+
  (vals.length>6?'<input class=hpop-sr placeholder="Buscar valor...">':'')+
  `<div class=hpop-act><button type=button id=hp-clr>Mostrar todos</button></div><div class=hpop-ls></div>`;
 const ls=pop.querySelector('.hpop-ls');
 const applyVal=v=>{
  flt[k]=v;lastF=k;syncSel();lim=100;
  const inp=document.querySelector(`.gt2 input[data-c="${k}"]`);if(inp)inp.value=v;
  gbody();closePop();
 };
 const drawList=(q='')=>{
  const fq=key(q);
  ls.innerHTML=vals.filter(v=>!fq||key(v).includes(fq)).slice(0,150).map(v=>{
   const on=cur&&v.toUpperCase()===cur;
   return `<div class=hpop-it data-v="${esc(v)}" style="${on?'background:#007aff;color:#fff':''}"><span>${esc(v)}</span></div>`;
  }).join('')||'<div style="padding:8px;font-size:13px;color:var(--mu)">Sin valores</div>';
  ls.querySelectorAll('.hpop-it').forEach(it=>it.onclick=()=>applyVal(it.dataset.v));
 };
 drawList();
 const sr=pop.querySelector('.hpop-sr');if(sr)sr.oninput=()=>drawList(sr.value);
 pop.querySelector('#hp-x').onclick=closePop;
 pop.querySelector('#hp-clr').onclick=()=>applyVal('');
 posPop(pop,th);
}
render();
</script></body></html>
