function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
function tsv(t){const R=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"'&&!c)q=true;else if(ch=='\t'){r.push(c);c=''}else if(ch=='\n'){r.push(c);R.push(r);r=[];c=''}else if(ch!='\r')c+=ch}
 if(c||r.length){r.push(c);R.push(r)}return R}

  const el=$('#'+id),sc=el.parentElement;el.style.transform='none';sc.style.overflow='visible';sc.style.height='auto';

  const D=window.claude?await claude.use('downloads'):null;
  if(D){try{await D.save({filename:name+'.png',data:blob});return}catch(e){if(e&&e.code==='declined')return}}

async function loadBgIdb(){try{const db=await openBgDb();const val=await new Promise((res,rej)=>{const tx=db.transaction('ajustes','readonly');const req=tx.objectStore('ajustes').get('fondo');req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)});db.close();return val||''}catch(e){return''}}
async function delBgIdb(){try{const db=await openBgDb();await new Promise((res,rej)=>{const tx=db.transaction('ajustes','readwrite');tx.objectStore('ajustes').delete('fondo');tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}catch(e){}}

loadBgIdb().then(d=>{
 if(d){
  if(d!==bgData){bgData=d;setBg(d);try{localStorage.setItem('fondo',d)}catch(e){}}
 }else if(!bgData){
  setBg(DEF_BG);
 }
});

let DB=null,UID=null;
async function initDb(){try{DB=await claude.use('db');const U=await claude.use('user');UID=U?await U.id():null;if(!DB||!UID)return;const s=await DB.doc('data/users/'+UID+'/ajustes').get();if(s.exists){const d=s.data();if(d.maestro)M=d.maestro;if(d.filtros&&d.filtros.t1&&d.filtros.t2)FL=d.filtros;if(Array.isArray(d.vis))VIS=d.vis;if(typeof d.fondo==='string'&&d.fondo){bgData=d.fondo;setBg(d.fondo);saveBgIdb(d.fondo);try{localStorage.setItem('fondo',d.fondo)}catch(e){}}else if(!bgData){setBg(DEF_BG)}render()}}catch(e){}}
async function saveDb(){try{if(DB&&UID)await DB.doc('data/users/'+UID+'/ajustes').set({maestro:M,fondo:bgData,filtros:FL,vis:VIS})}catch(e){}}
initDb();

$('#bb').onclick=()=>$('#fb').click();
$('#fb').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);im.onload=async()=>{const s=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);let d=c.toDataURL('image/jpeg',.78);if(d.length>230000)d=c.toDataURL('image/jpeg',.55);bgData=d;setBg(d);await saveBgIdb(d);try{localStorage.setItem('fondo',d)}catch(x){}saveDb();toast('✓ Fondo guardado como predeterminado');URL.revokeObjectURL(u)};im.src=u;e.target.value=''};
$('#rb').onclick=async()=>{bgData='';setBg(DEF_BG);await delBgIdb();try{localStorage.removeItem('fondo')}catch(e){}saveDb();toast('Fondo restaurado al predeterminado')};
$('#bx').onclick=()=>{rows=[];$('#st').textContent='';render();renderGrid()};
render();
</script></body></html>
